name: Node.js CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16, 18, 20]

    steps:
      - uses: actions/checkout@v3 # clone the repo

      - name: Setup Node.js
        uses: actions/setup-node@v3 # setup node
        with:
          node-version: ${{ matrix.node-version }} # node version
          cache: "npm" # cache node modules, 설치 시간 줄이기
      
      - name: Install dependencies
        run: npm ci # install dependencies
      
      - name: Run tests
        run: npm test # run tests

      - name: Lint code
        run: npm run lint # run linter